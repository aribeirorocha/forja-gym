<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forja Gym - Feedback & Disputas</title>

   
</head>

<body>

    <header>
        <h1>Forja Gym</h1>
        <p>Feedback & Resolução de Disputas</p>
    </header>

    <div class="container">

        <!-- Feedback -->
        <div class="card">
            <h2>Deixe o seu Feedback</h2>

            <form>
                <label>Nome</label>
                <input type="text" placeholder="Seu nome">

                <label>Email</label>
                <input type="email" placeholder="Seu email">

                <label>Avaliação</label>
                <select>
                    <option>Excelente</option>
                    <option>Bom</option>
                    <option>Regular</option>
                    <option>Mau</option>
                </select>

                <label>Comentário</label>
                <textarea rows="4" placeholder="Escreva o seu feedback..."></textarea>

                <button type="submit">Enviar Feedback</button>
            </form>
        </div>

        <!-- Disputas -->
        <div class="card">
            <h2>Abrir uma Disputa</h2>

            <form>
                <label>Nome</label>
                <input type="text" placeholder="Seu nome">

                <label>Email</label>
                <input type="email" placeholder="Seu email">

                <label>Tipo de Problema</label>
                <select>
                    <option>Pagamento</option>
                    <option>Plano/Assinatura</option>
                    <option>Atendimento</option>
                    <option>Outro</option>
                </select>

                <label>Descrição do Problema</label>
                <textarea rows="5" placeholder="Explique o problema..."></textarea>

                <button type="submit">Enviar Disputa</button>
            </form>
        </div>

    </div>

    <footer>
        <p>© 2026 Forja Gym - Todos os direitos reservados</p>
    </footer>

</body>
</html>
