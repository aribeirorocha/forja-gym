<!DOCTYPE html>
<html>
    <head>
        <title>Forja Gym</title>    
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="../css/style.css" rel="stylesheet">
        <link href="../css/forms.css" rel="stylesheet">
        <link href="../css/responsive.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1 class="logo">FORJA</h1>
            <a href="aulas.html">Aulas</a>
            <a href="trainers.html">Trainers</a>
            <a href="equip.html">Equipamentos</a>
            <div id="signup">
                <a href="login.html">Login</a>
                <a href="register.html">Registar</a>
            </div>
        </header>
        <section>
            <h1 class="logo">FORJA</h1>
            <p>Porto &middot; Ginásio</p>
            <input type="radio" name="switch-login" id="radio-login" checked> 
            <label for="radio-login">Login</label>
            <input type="radio" name="switch-login" id="radio-register">
            <label for="radio-register">Registar</label>
            <div id="login-tab">
                <form name="login">
                    <label>
                        Email <input type="text" name="email">
                    </label>
                    <label>
                        Palavra-passe <input type="password" name="password">
                    </label>
                </form>
                <p><a href="recover.html">Esqueceste-te?</a></p>
                <button formtarget="login" formmethod="post">Entrar</button>
                <p><span>ou</span></p>
                <p>Não tens conta? <label for="radio-register">Regista-te</label></p>
            </div>
            <div id="register-tab">
                <form name="register">
                    <label>
                        Nome <input type="text" name="name">
                    </label>
                    <label>
                        Email <input type="text" name="email">
                    </label>
                    <label>
                        Palavra-passe <input type="password" name="password">
                    </label>
                </form>
                <button formtarget="register" formmethod="post">Criar conta</button>
                <p><span>ou</span></p>
                <p>Já tens conta? <label for="radio-login">Entrar</label></p>
            </div>
        </section>
        <footer>
            <h2 class="logo">Forja</h2>
            <a href="terms.html">Contacto</a>
            <a href="terms.html">Privacidade</a>
            <a href="terms.html">Termos</a>
            <p>&copy; 2026 Forja Gym &middot; Porto, Portugal</p>
        </footer>
    </body>
</html>
