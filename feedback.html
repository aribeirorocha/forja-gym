<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forja Gym - Feedback & Disputas</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #000;
            color: #ff6600;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: #fff;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            color: #ff6600;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 15px;
            background-color: #ff6600;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #e65c00;
        }

        footer {
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Forja Gym</h1>
        <p>Feedback & Resolução de Disputas</p>
    </header>

    <div class="container">

        <!-- Feedback -->
        <div class="card">
            <h2>Deixe o seu Feedback</h2>

            <form>
                <label>Nome</label>
                <input type="text" placeholder="Seu nome">

                <label>Email</label>
                <input type="email" placeholder="Seu email">

                <label>Avaliação</label>
                <select>
                    <option>Excelente</option>
                    <option>Bom</option>
                    <option>Regular</option>
                    <option>Mau</option>
                </select>

                <label>Comentário</label>
                <textarea rows="4" placeholder="Escreva o seu feedback..."></textarea>

                <button type="submit">Enviar Feedback</button>
            </form>
        </div>

        <!-- Disputas -->
        <div class="card">
            <h2>Abrir uma Disputa</h2>

            <form>
                <label>Nome</label>
                <input type="text" placeholder="Seu nome">

                <label>Email</label>
                <input type="email" placeholder="Seu email">

                <label>Tipo de Problema</label>
                <select>
                    <option>Pagamento</option>
                    <option>Plano/Assinatura</option>
                    <option>Atendimento</option>
                    <option>Outro</option>
                </select>

                <label>Descrição do Problema</label>
                <textarea rows="5" placeholder="Explique o problema..."></textarea>

                <button type="submit">Enviar Disputa</button>
            </form>
        </div>

    </div>

    <footer>
        <p>© 2026 Forja Gym - Todos os direitos reservados</p>
    </footer>

</body>
</html>
